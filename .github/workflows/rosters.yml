name: Refresh cricket rosters
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
  push:
    paths:
      - 'roster/**'
      - '.github/workflows/rosters.yml'
permissions:
  contents: write
concurrency:
  group: cricket-roster-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-local.txt
      - run: python -m unittest discover -s roster/tests -v
      - run: python -m roster.refresh
      - name: Save successful snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/rosters.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh recent cricket players and form"
            git push
          fi
